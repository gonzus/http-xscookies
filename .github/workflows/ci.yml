name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:

jobs:
  test:
    name: "perl ${{ matrix.perl }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        perl:
          - 'devel'
          - '5.44'
          - '5.42'
          - '5.40'
          - '5.38'
          - '5.36'   # first release above the C99 boundary: no -std=c89
          - '5.34'   # below the boundary: still receives -std=c89
    container:
      image: perl:${{ matrix.perl }}

    steps:
      - uses: actions/checkout@v5

      - name: Environment
        run: |
          perl -v
          perl -V:cc -V:ccflags -V:gccversion -V:version
          cc --version || true

      - name: Install test dependencies
        run: cpanm --notest Date::Parse

      - name: Build
        run: |
          perl Makefile.PL
          make

      - name: Test
        run: make test
